name: Tag versions

# Gives each new config version its git tag (0.3, 0.4, ...): after a push to
# main that changes flake.nix, scripts/tag-versions.sh tags the pushed
# commit with the version it sets, if that version has no tag yet. Neither
# the laptop nor the Update flake.lock workflow tags anything itself.
on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - scripts/tag-versions.sh
      - .github/workflows/tag.yml
  workflow_dispatch:

permissions:
  contents: write # push the tags
  issues: write # a failure opens an issue (.github/actions/ci-issue)

# One run at a time, and never cancelled half-way: a later run tags
# whatever an earlier one hadn't.
concurrency:
  group: tag-versions
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # With the existing tags, to see whether the version has one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag new versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          new=$(scripts/tag-versions.sh)
          if [ -n "$new" ]; then
            git push origin "refs/tags/$new"
            echo "Tagged: $new" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This version already has its tag." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report in an issue
        if: always()
        uses: ./.github/actions/ci-issue
        with:
          status: ${{ job.status }}
          hint: >-
            The config versions didn't get their git tags. Nothing on the
            laptop is affected; the next push to flake.nix (or running this
            workflow by hand) tries again.
